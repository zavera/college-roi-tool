spring.application.name=college-roi-tool
spring.web.resources.static-locations=classpath:/static/
server.port=${PORT:8080}

# User config
app.user.email=zaver.ambreen@gmail.com

# Groq API config  (set GROQ_API_KEY as an environment variable in Railway)
groq.api.key=${GROQ_API_KEY:GROQ_KEY_SET_VIA_ENV}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b

# Premium dev bypass — set PREMIUM_DEV_BYPASS=false in Railway production env
premium.dev.bypass=${PREMIUM_DEV_BYPASS:true}

# Tavily API config — live search for 0% balance transfer / refinancing offers,
# scholarship search, and Award Assist (FAFSA Prep asset-repositioning uses a hardcoded
# reference table instead — see fafsa_handbook_reference / FafsaHandbookReferenceSeeder)
# (set TAVILY_API_KEY as an environment variable in Railway; get a key at https://tavily.com)
tavily.api.key=${TAVILY_API_KEY:TAVILY_API_KEY_NOT_SET}

# Anthropic (Claude) API config — FAFSA Prep asset-repositioning analysis
# (set ANTHROPIC_API_KEY as an environment variable in Railway; get a key at https://console.anthropic.com)
anthropic.api.key=${ANTHROPIC_API_KEY:ANTHROPIC_API_KEY_NOT_SET}
anthropic.model=claude-haiku-4-5
# Scholarships: live search already comes from Tavily (ScholarshipService) — this model just
# ranks/formats the already-fetched results, so it runs on Haiku (no output_config.effort —
# unsupported on Haiku 4.5, see AnthropicService.getScholarshipRecommendations).
anthropic.model.scholarship=claude-haiku-4-5
# Award Assist: Tavily fetch (AwardAssistService) for school/major-specific facts (clubs,
# scholarships, resources, jobs), then Claude Haiku turns it into the AI Financial Summary
# content. The Gap Analysis / Student Profile / Key Metrics / repayment tables shown alongside
# it are deterministic client-side math (app.html) — no AI involved there.
anthropic.model.awardassist=claude-haiku-4-5
# Post-Grad Debt Relief: AI Assist recommendation, State-Specific Assistance, and lender-research
# summaries all run on Haiku, fed by Tavily (already wired in via fetchLiveDebtContent/
# fetchPrivateLenderResearch in DebtManagementController). Hardship-letter generation (SSE
# streaming) stays on Groq for now — migrating that needs a different streaming integration.
anthropic.model.postgrad=claude-haiku-4-5
# Ask Astra chatbot: read-only, scoped to the logged-in user's own saved data via a native
# Claude tool (get_my_saved_data_history, see AnthropicService.getChatResponse / ChatbotContextService).
# No write access exposed to the model. Tavily live search stays available for general questions.
anthropic.model.chatbot=claude-haiku-4-5
# Startup Locator: Tavily fetch (StartupLocatorService) for real on-campus startups/incubators,
# nearby-city startups, and events; Claude Haiku formats/ranks the already-fetched results —
# same "fetch first, then render" pattern as Award Assist and Scholarships.
anthropic.model.startup=claude-haiku-4-5

# Per-user monthly spend cap on Claude usage, in USD (see TokenUsageService / token_usage table).
token.usage.monthly.cap.usd=${TOKEN_USAGE_MONTHLY_CAP_USD:20.00}

# Azure Document Intelligence — key-value extraction for FAFSA Prep tax document uploads
# (set AZURE_DOCINTEL_ENDPOINT/AZURE_DOCINTEL_KEY as environment variables in Railway)
azure.docintel.endpoint=${AZURE_DOCINTEL_ENDPOINT:AZURE_DOCINTEL_ENDPOINT_NOT_SET}
azure.docintel.key=${AZURE_DOCINTEL_KEY:AZURE_DOCINTEL_KEY_NOT_SET}

# File uploads — FAFSA Prep tax document uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Database ────────────────────────────────────────────────────────────────
# Local dev: H2 in-memory (no setup needed)
# Production (Railway): set DATABASE_URL env var → Postgres is auto-detected
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:astradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=${H2_CONSOLE:true}

# Don't hold a Hibernate session (and its JDBC connection) open for the full
# request when a controller does DB work + a slow external call (Groq/Tavily).
# Without this, AI-heavy endpoints can starve the Hikari pool under concurrent load.
spring.jpa.open-in-view=false

# ── Google OAuth2 ──────────────────────────────────────────────────────────
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in Railway (and local .env)
# Get credentials at: https://console.cloud.google.com/apis/credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:GOOGLE_CLIENT_ID_NOT_SET}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:GOOGLE_CLIENT_SECRET_NOT_SET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ── Stripe ─────────────────────────────────────────────────────────────────
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.price.id=${STRIPE_PRICE_ID:price_placeholder}

# ── Session ────────────────────────────────────────────────────────────────
server.servlet.session.timeout=7d

# ── Proxy / forwarded-headers (Railway + Cloudflare) ──────────────────────
# Trust X-Forwarded-Proto so Spring Security builds https:// redirect URIs
server.forward-headers-strategy=NATIVE

# Azure Blob Storage -- stores uploaded student documents
# Set AZURE_BLOB_CONNECTION_STRING in Railway dashboard (Settings > Variables)
azure.blob.connection-string=${AZURE_BLOB_CONNECTION_STRING:NOT_SET}
azure.blob.container-name=${AZURE_BLOB_CONTAINER:student-documents}

# ── Magic link sign-in ─────────────────────────────────────────────────────
# Set MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD in Railway
# For Gmail App Password: host=smtp.gmail.com port=587
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.base-url=${APP_BASE_URL:https://astra-ed.org}
app.magic-link.expiry-minutes=15

# ── Resend (transactional email) ───────────────────────────────────────────
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Astra <onboarding@resend.dev>}
